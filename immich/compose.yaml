name: immich

services:

  immich-server:
    container_name: immich_server
    # Pinned via IMMICH_VERSION in .env. Keep it on a specific version rather
    # than "release": restart.sh runs `docker compose pull`, and the database
    # image below is held at vectorchord 0.3.0, so an unattended jump to a
    # release that expects a newer extension would break on restart.
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/hardware-transcoding
    #    file: hwaccel.transcoding.yml
    #    service: nvenc # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - ${LIBRARY_LOCATION}:/library
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      # - 2283:2283
      - 80:2283
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false

  # immich-machine-learning:
  #   container_name: immich_machine_learning
  #   # For hardware acceleration, add one of -[armnn, cuda, openvino] to the image tag.
  #   # Example tag: ${IMMICH_VERSION:-release}-cuda
  #   image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
  #   # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
  #   #    file: hwaccel.ml.yml
  #   #    service: cuda # set to one of [armnn, cuda, openvino, openvino-wsl] for accelerated inference - use the `-wsl` version for WSL2 where applicable
  #   volumes:
  #     - model-cache:/cache # also uncomment the top-level `volumes:` block at the end of this file
  #   env_file:
  #     - .env
  #   restart: unless-stopped
  #   healthcheck:
  #     disable: false

  redis:
    container_name: immich_redis
    # Valkey is the maintained drop-in; redis 6.2 is end of life. Nothing is
    # mounted here -- this holds only the job queue, which Immich rebuilds --
    # so swapping the image moves no data.
    image: docker.io/valkey/valkey:9-alpine
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  database:
    container_name: immich_postgres
    # Held at pg14 / vectorchord 0.3.0 on purpose: a major bump needs pg_upgrade
    # and moves PGDATA from /var/lib/postgresql/data to /var/lib/postgresql/<major>/docker.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: unless-stopped
    # Postgres spills to disk on Immich's larger queries at the 64mb default.
    shm_size: 128mb
    healthcheck:
      disable: false

# Only needed by immich-machine-learning above; uncomment both together.
# volumes:
#   model-cache:
